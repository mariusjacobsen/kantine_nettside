{% extends "base.html" %}

{% block title %}Varer{% endblock %}

{% block content %}
    <h1>Varer</h1>

    {% for vare in varer %}
        <div class="vare">
            <img src="{{ vare.bilde }}" alt="{{ vare.navn }}">
            <p>{{ vare.navn }}</p>
            <p class="pris">{{ vare.pris }} kr</p>
        </div>
    {% endfor %}
{% endblock %}
